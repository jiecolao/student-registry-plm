name: Apply admin recovery OTP fix

on:
  push:
    branches:
      - migration/nursync-supabase-v2

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: migration/nursync-supabase-v2

      - name: Update admin forgot-password flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          pattern = r'const \{ error \} = await sb\.auth\.signInWithOtp\(\{\s*email,\s*options: \{ shouldCreateUser: false \},\s*\}\);'
          replacement = 'const { error } = await sb.auth.resetPasswordForEmail(email);'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit("Expected signInWithOtp block was not found")

          pattern = r'type: "email",'
          text, count = re.subn(pattern, 'type: "recovery",', text, count=1)
          if count != 1:
              raise SystemExit("Expected email verification type was not found")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-admin-recovery-otp-fix.yml
          git add index.html
          git commit -m "fix: use recovery OTP for admin password reset"
          git push origin migration/nursync-supabase-v2
