name: Apply graduation analytics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply analytics and remove this temporary workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css_marker = '      @media (max-width: 650px) {'
          css = '''      .grad-analytics {\n        display: grid;\n        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));\n        gap: 12px;\n        margin-bottom: 18px;\n      }\n      .grad-stat {\n        background: #fff;\n        border: 1px solid var(--line);\n        border-radius: 12px;\n        padding: 15px;\n      }\n      .grad-stat .num { font-size: 25px; }\n      .grad-stat .lbl { margin-top: 2px; }\n'''
          if '.grad-analytics {' not in s:
              s = s.replace(css_marker, css + css_marker, 1)
          html_marker = '          <div class="controls">'
          if 'id="graduationStats"' not in s:
              s = s.replace(html_marker, '          <div id="graduationStats" class="grad-analytics"></div>\n' + html_marker, 1)
          fn_marker = '      function renderStudents(openStudentId = null) {'
          fn = '''      function renderGraduationStats() {\n        const container = document.getElementById("graduationStats");\n        if (!container) return;\n        const counts = new Map();\n        students.forEach((student) => {\n          if (student.year_graduated !== null && student.year_graduated !== undefined && student.year_graduated !== "") {\n            const year = String(student.year_graduated);\n            counts.set(year, (counts.get(year) || 0) + 1);\n          }\n        });\n        const years = [...counts.keys()].sort((a, b) => Number(a) - Number(b));\n        container.innerHTML = years.length\n          ? years.map((year) => `<div class="grad-stat"><div class="num">${counts.get(year)}</div><div class="lbl">Graduates of ${esc(year)}</div></div>`).join("")\n          : '<div class="panel" style="padding:15px;color:#4b5670">No graduation-year data available.</div>';\n      }\n'''
          if 'function renderGraduationStats()' not in s:
              s = s.replace(fn_marker, fn + fn_marker, 1)
          render_marker = '      function renderStudents(openStudentId = null) {\n        const q ='
          if render_marker in s:
              s = s.replace(render_marker, '      function renderStudents(openStudentId = null) {\n        renderGraduationStats();\n        const q =', 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/apply-graduation-analytics.yml').unlink()
      - name: Commit final file only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-graduation-analytics.yml
          git commit -m "feat: add graduation year analytics"
          git push
