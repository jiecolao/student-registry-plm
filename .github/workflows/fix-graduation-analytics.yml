name: Fix graduation analytics render

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix render call and remove this workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '      function renderStudents(openStudentId = null) { const q ='
          new = '      function renderStudents(openStudentId = null) { renderGraduationStats(); const q ='
          if old in s and 'renderGraduationStats(); const q' not in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/fix-graduation-analytics.yml').unlink()
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-graduation-analytics.yml
          git commit -m "fix: render graduation year analytics"
          git push
