<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NurSync</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --paper: #f6f3ec;
        --card: #fff;
        --ink: #1b2a4a;
        --soft: #4b5670;
        --muted: #8b8578;
        --line: #dcd6c8;
        --green: #3f6b4e;
        --deep: #2c4a37;
        --greenbg: #e7efe8;
        --red: #b23a34;
        --redbg: #f6e4e1;
        --amber: #a6621b;
        --amberbg: #f5eada;
        --gold: #c9a66b;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font-family: Inter, system-ui, -apple-system, sans-serif; }
      .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .gate-box { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px #1b2a4a12; }
      .mark { width: 64px; height: 64px; border: 2px solid var(--green); border-radius: 50%; overflow: hidden; margin: 0 auto 18px; }
      .mark img { width: 100%; height: 100%; object-fit: cover; }
      .gate h1 { text-align: center; font-family: Georgia, serif; font-weight: 500; margin: 0 0 6px; font-size: 32px; }
      .sub { text-align: center; color: var(--soft); font-size: 14px; margin: 0 0 24px; }
      .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
      .tabs button { flex: 1; }
      .tab { padding: 9px; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; }
      .tab.active { background: var(--green); color: #fff; border-color: var(--green); }
      label { display: block; font-size: 12px; color: var(--soft); font-weight: 600; margin: 0 0 6px; }
      input, select { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font: inherit; margin-bottom: 14px; }
      button { font: inherit; }
      .btn { width: 100%; padding: 10px 16px; border: 1px solid var(--green); border-radius: 8px; background: var(--green); color: #fff; cursor: pointer; }
      .btn:hover { background: var(--deep); }
      .error { color: var(--red); background: var(--redbg); padding: 9px 11px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
      .hidden { display: none !important; }
      .topbar { background: var(--deep); color: #efeae0; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand img { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--gold); object-fit: cover; }
      .brand strong { font-family: Georgia, serif; font-weight: 500; }
      .role { display: block; color: var(--gold); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
      .signout { padding: 7px 13px; border: 1px solid #ffffff44; background: transparent; color: #fff; border-radius: 7px; cursor: pointer; }
      .main { max-width: 1100px; margin: auto; padding: 26px 24px 70px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
      .stat, .panel, .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; }
      .stat { padding: 15px; }
      .num { font-family: Georgia, serif; font-size: 25px; }
      .lbl { font-size: 12px; color: var(--soft); }
      .controls { padding: 13px; display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 16px; }
      .controls input, .controls select { margin: 0; }
      .controls input { flex: 1; min-width: 220px; }
      .controls select { width: auto; }
      .controls select#yearFilter { min-width: 200px; }
      .controls select#sortFilter { min-width: 255px; }
      .controls select#sortDirection { min-width: 145px; }
      .add { width: auto; white-space: nowrap; }
      .card { overflow: hidden; margin-bottom: 10px; }
      .head { padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
      .id { font-family: monospace; font-size: 12px; background: var(--greenbg); color: var(--deep); padding: 5px 8px; border-radius: 6px; }
      .name { font-family: Georgia, serif; font-size: 17px; flex: 1; }
      .meta { font-size: 12px; color: var(--soft); }
      .stamp { font-family: monospace; font-size: 11px; padding: 5px 9px; border-radius: 14px; }
      .complete { background: var(--greenbg); color: var(--deep); }
      .partial { background: var(--amberbg); color: var(--amber); }
      .empty { background: var(--redbg); color: var(--red); }
      .body { display: none; border-top: 1px solid var(--line); padding: 18px; background: #fcfaf5; }
      .card.open .body { display: block; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 20px; }
      .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .v { font-size: 14px; margin-top: 3px; }
      .docs h3 { font: 500 15px Georgia, serif; margin: 0 0 10px; }
      .doc { display: flex; align-items: center; gap: 10px; padding: 9px 11px; background: #fff; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 7px; flex-wrap: wrap; }
      .doc.checked { border-color: var(--green); background: var(--greenbg); }
      .check { width: 19px; height: 19px; border: 1px solid var(--muted); border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
      .checked .check { background: var(--green); color: #fff; border-color: var(--green); }
      .doclabel { flex: 1; min-width: 150px; font-size: 13px; }
      .doc input { width: 190px; margin: 0; padding: 6px 8px; font-size: 12px; }
      .small { width: auto; padding: 6px 10px; font-size: 12px; }
      .link { font-size: 12px; color: var(--deep); text-decoration: underline; }
      .actions { display: flex; gap: 8px; margin-top: 15px; }
      .danger { border-color: var(--red); color: var(--red); background: #fff; }
      .modal { position: fixed; inset: 0; background: #1b2a4a66; display: none; align-items: flex-start; justify-content: center; padding: 35px 16px; overflow: auto; z-index: 10; }
      .modal.open { display: flex; }
      .modal-box { background: #fff; border-radius: 14px; padding: 24px; width: min(650px, 100%); }
      .modal h2 { font: 500 21px Georgia, serif; margin: 0 0 5px; }
      .modal p { color: var(--soft); font-size: 13px; }
      .formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .full { grid-column: 1/-1; }
      .modal-actions { display: flex; gap: 8px; }
      .modal-actions button { flex: 1; }
      .cancel { background: #fff; color: var(--ink); border-color: var(--line); }
      .notice { padding: 11px; background: var(--amberbg); color: var(--amber); border-radius: 8px; font-size: 12px; margin-bottom: 14px; }
      .forgot { display: block; width: 100%; margin-top: 10px; border: 0; background: transparent; color: var(--deep); font-size: 13px; text-decoration: underline; cursor: pointer; }
      .grad-analytics { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 12px; margin-bottom: 18px; }
      .grad-stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 15px; }
      .grad-stat .num { font-size: 25px; }
      .grad-stat .lbl { margin-top: 2px; }
      @media (max-width: 650px) { .stats { grid-template-columns: 1fr; } .formgrid { grid-template-columns: 1fr; } .full { grid-column: auto; } .topbar { padding: 12px 16px; } .main { padding: 18px 12px; } .meta { display: none; } .controls select { width: 100%; } }
    </style>
  </head>
  <body>
    <div id="login" class="gate">
      <div class="gate-box">
        <div class="mark"><img src="logo.png" alt="NurSync" /></div>
        <h1>NurSync</h1>
        <p class="sub">File Management System</p>
        <div class="tabs">
          <button id="adminTab" class="tab active" onclick="showLogin('admin')">Admin</button>
          <button id="studentTab" class="tab" onclick="showLogin('student')">Student</button>
        </div>
        <div id="loginError" class="error hidden"></div>
        <form id="loginForm">
          <label id="loginIdLabel">Admin email</label><input id="loginId" type="email" autocomplete="username" required />
          <label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required />
          <button class="btn" type="submit">Sign in</button>
          <button id="forgotLink" type="button" class="forgot" onclick="openForgotPassword()">Forgot Password?</button>
        </form>
      </div>
    </div>
    <div id="app" class="hidden">
      <header class="topbar">
        <div class="brand"><img src="logo.png" alt="" /><div><strong>NurSync</strong><span id="roleLabel" class="role"></span></div></div>
        <div><span id="sync" style="font-size: 12px; margin-right: 12px">● Live</span><button class="signout" onclick="signOut()">Sign out</button></div>
      </header>
      <main class="main">
        <div id="adminView" class="hidden">
          <div class="stats">
            <div class="stat"><div id="studentCount" class="num">0</div><div class="lbl">Students</div></div>
            <div class="stat"><div id="submittedCount" class="num">0</div><div class="lbl">Documents submitted</div></div>
            <div class="stat"><div id="requiredCount" class="num">0</div><div class="lbl">Required documents</div></div>
          </div>
          <div id="graduationStats" class="grad-analytics"></div>
          <div class="controls">
            <input id="search" placeholder="Search Student ID, name, email, or contact..." oninput="renderStudents()" />
            <select id="yearFilter" onchange="renderStudents()"><option value="">All years graduated</option></select>
            <select id="sortFilter" onchange="renderStudents()">
              <option value="year">Sort: Year graduated</option>
              <option value="name">Sort: Name</option>
              <option value="student_number">Sort: Student number</option>
              <option value="documents">Sort: Documents complete</option>
            </select>
            <select id="sortDirection" onchange="renderStudents()">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>
            <button class="btn add" onclick="openStudentModal()">+ Add student</button>
          </div>
          <div id="studentList"></div>
        </div>
        <div id="studentView" class="hidden"><div id="studentProfile"></div></div>
      </main>
    </div>
    <div id="studentModal" class="modal">
      <div class="modal-box">
        <h2 id="modalTitle">Add student</h2><p>Student information and optional login password.</p>
        <div id="modalError" class="error hidden"></div>
        <div class="formgrid">
          <div><label>Student ID</label><input id="fNumber" /></div><div><label>Full name</label><input id="fName" /></div>
          <div><label>Sex</label><select id="fSex"><option value="">Select</option><option>Male</option><option>Female</option></select></div>
          <div><label>Date of birth</label><input id="fDob" type="date" /></div><div><label>Contact number</label><input id="fContact" /></div><div><label>Email</label><input id="fEmail" type="email" /></div>
          <div class="full"><label>Provincial address</label><input id="fProv" /></div><div class="full"><label>City address</label><input id="fCity" /></div>
          <div><label>Year graduated</label><input id="fGrad" type="number" /></div><div><label>Year residency</label><input id="fResid" type="number" /></div>
          <div><label>Student password <span style="font-weight: 400; color: #8b8578">(optional; minimum 8 characters)</span></label><input id="fPassword" type="password" autocomplete="new-password" /></div>
          <div><label>Confirmation Password</label><input id="fPasswordConfirm" type="password" autocomplete="new-password" /></div>
        </div>
        <div class="modal-actions"><button class="btn cancel" onclick="closeStudentModal()">Cancel</button><button class="btn" onclick="saveStudent()">Save student</button></div>
      </div>
    </div>
    <div id="forgotModal" class="modal">
      <div class="modal-box">
        <h2>Forgot Password</h2>
        <p id="forgotDescription">Enter your admin email. A one-time password will be sent to that email for verification.</p>
        <div id="forgotError" class="error hidden"></div>
        <div id="forgotStep1">
          <label>Admin email</label><input id="forgotEmail" type="email" autocomplete="email" placeholder="admin@example.com" />
          <div class="modal-actions"><button class="btn cancel" onclick="closeForgotPassword()">Cancel</button><button class="btn" onclick="sendAdminOtp()">Send OTP</button></div>
        </div>
        <div id="forgotStep2" class="hidden">
          <label>Verification OTP</label><input id="forgotOtp" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="8-digit code" />
          <label>New password</label><input id="forgotNewPassword" type="password" autocomplete="new-password" placeholder="Minimum 8 characters" />
          <label>Confirm new password</label><input id="forgotConfirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter password" />
          <div class="modal-actions"><button class="btn cancel" onclick="closeForgotPassword()">Cancel</button><button class="btn" onclick="verifyAdminOtpAndReset()">Verify & Reset</button></div>
        </div>
      </div>
    </div>
    <script>
      const SUPABASE_URL = "https://kivbqllahiisffihnrgh.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpdmJxbGxhaGlpc2ZmaGhuanJoZyIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzU1MDE0MTYwLCJleHAiOjIwNzA1MDE0MTYwfQ.dummy-public-placeholder";
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      let loginMode = "admin";
      let session = null;
      let students = [];
      let docs = [];
      let docTypes = [];
      let editingId = null;
      let forgotEmail = "";
      let adminEmails = [];

      function esc(v) { return String(v ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c])); }
      function showLogin(mode) {
        loginMode = mode;
        document.getElementById("adminTab").classList.toggle("active", mode === "admin");
        document.getElementById("studentTab").classList.toggle("active", mode === "student");
        document.getElementById("loginIdLabel").textContent = mode === "admin" ? "Admin email" : "Student ID";
        document.getElementById("loginId").type = mode === "admin" ? "email" : "text";
        document.getElementById("loginId").autocomplete = mode === "admin" ? "username" : "username";
        document.getElementById("forgotLink").classList.toggle("hidden", mode !== "admin");
        document.getElementById("loginError").classList.add("hidden");
      }
      function setError(id, message) { const el = document.getElementById(id); el.textContent = message; el.classList.remove("hidden"); }
      function clearError(id) { document.getElementById(id).classList.add("hidden"); }
      async function signIn(e) {
        e.preventDefault(); clearError("loginError");
        const id = document.getElementById("loginId").value.trim();
        const password = document.getElementById("loginPassword").value;
        try {
          let email = id;
          if (loginMode === "student") {
            const { data, error } = await sb.from("students").select("email").eq("student_number", id).maybeSingle();
            if (error) throw error;
            if (!data?.email) throw new Error("No email is registered for this student.");
            email = data.email;
          }
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          session = data.session;
          await enterApp();
        } catch (err) { setError("loginError", err.message || "Unable to sign in."); }
      }
      document.getElementById("loginForm").addEventListener("submit", signIn);

      async function enterApp() {
        document.getElementById("login").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        const email = session?.user?.email || "";
        const { data: studentLink } = await sb.from("student_accounts").select("student_id").eq("user_id", session.user.id).maybeSingle();
        const isAdmin = !studentLink;
        document.getElementById("roleLabel").textContent = isAdmin ? "Registrar / Admin" : "Student";
        document.getElementById("adminView").classList.toggle("hidden", !isAdmin);
        document.getElementById("studentView").classList.toggle("hidden", isAdmin);
        if (isAdmin) await loadAdminData(); else await loadStudentProfile(studentLink.student_id);
      }
      async function loadAdminData() {
        const [s, d, t] = await Promise.all([
          sb.from("students").select("*").order("full_name"),
          sb.from("student_documents").select("*"),
          sb.from("document_types").select("*").order("name")
        ]);
        if (s.error) throw s.error; if (d.error) throw d.error; if (t.error) throw t.error;
        students = s.data || []; docs = d.data || []; docTypes = t.data || [];
        const years = [...new Set(students.map(s => s.year_graduated).filter(v => v !== null && v !== undefined && v !== ""))].sort((a,b) => Number(a)-Number(b));
        const yf = document.getElementById("yearFilter");
        yf.innerHTML = '<option value="">All years graduated</option>' + years.map(y => `<option value="${esc(y)}">${esc(y)}</option>`).join("");
        renderStudents();
      }
      function completedDocuments(s) { return docs.filter(d => d.student_id === s.id && d.is_submitted).length; }
      function compareStudentValues(a, b, field) {
        if (field === "documents") return completedDocuments(a) - completedDocuments(b);
        if (field === "year") {
          const av = String(a.year_graduated ?? "").trim();
          const bv = String(b.year_graduated ?? "").trim();
          const an = Number(av); const bn = Number(bv);
          if (av === "" && bv !== "") return 1;
          if (av !== "" && bv === "") return -1;
          if (Number.isFinite(an) && Number.isFinite(bn)) return an - bn;
          if (Number.isFinite(an) && !Number.isFinite(bn)) return -1;
          if (!Number.isFinite(an) && Number.isFinite(bn)) return 1;
          return av.localeCompare(bv, undefined, { numeric: true, sensitivity: "base" });
        }
        if (field === "student_number") return String(a.student_number ?? "").localeCompare(String(b.student_number ?? ""), undefined, { numeric: true, sensitivity: "base" });
        return String(a.full_name ?? "").localeCompare(String(b.full_name ?? ""), undefined, { sensitivity: "base" });
      }
      function renderStudents(openStudentId = null) {
        renderGraduationStats();
        const q = document.getElementById("search").value.trim().toLowerCase();
        const y = document.getElementById("yearFilter").value;
        const sort = document.getElementById("sortFilter")?.value || "year";
        const direction = document.getElementById("sortDirection")?.value || "asc";
        const list = students.filter(s => {
          const searchable = [s.student_number, s.full_name, s.year_graduated, s.email, s.contact_number].filter(v => v !== null && v !== undefined).join(" ").toLowerCase();
          return (!q || searchable.includes(q)) && (!y || String(s.year_graduated) === y);
        }).sort((a,b) => {
          const result = compareStudentValues(a,b,sort);
          if (result !== 0) return direction === "desc" ? -result : result;
          return String(a.full_name ?? "").localeCompare(String(b.full_name ?? ""), undefined, { sensitivity: "base" });
        });
        document.getElementById("studentList").innerHTML = list.length ? list.map(studentCard).join("") : '<div class="panel" style="padding:40px;text-align:center;color:#4b5670">No students found.</div>';
        document.getElementById("studentCount").textContent = students.length;
        document.getElementById("submittedCount").textContent = docs.filter(d => d.is_submitted).length;
        document.getElementById("requiredCount").textContent = students.length * docTypes.filter(t => t.is_required).length;
        if (openStudentId) document.getElementById("card-" + openStudentId)?.classList.add("open");
      }
      function renderGraduationStats() {
        const container = document.getElementById("graduationStats");
        if (!container) return;
        const counts = new Map();
        students.forEach(student => {
          if (student.year_graduated !== null && student.year_graduated !== undefined && student.year_graduated !== "") {
            const year = String(student.year_graduated);
            counts.set(year, (counts.get(year) || 0) + 1);
          }
        });
        const years = [...counts.keys()].sort((a,b) => Number(a)-Number(b));
        container.innerHTML = years.length ? years.map(year => `<div class="grad-stat"><div class="num">${counts.get(year)}</div><div class="lbl">Graduates of ${esc(year)}</div></div>`).join("") : '<div class="panel" style="padding:15px;color:#4b5670">No graduation-year data available.</div>';
      }
      function studentCard(s) {
        const [label, cls] = stamp(s.id);
        return `<div class="card" id="card-${s.id}"><div class="head" onclick="toggleCard('${s.id}')"><span class="id">${esc(s.student_number)}</span><span class="name">${esc(s.full_name)}</span><span class="meta">${esc(s.year_graduated || "")}</span><span class="stamp ${cls}">${label}</span><span>›</span></div><div class="body">${detailHtml(s)}<div class="docs"><h3>Document checklist</h3>${docTypes.map(t => docRow(s,t,true)).join("")}</div><div class="actions"><button class="small" onclick="stopCardToggle(event);editStudent('${s.id}')">Edit</button><button class="small danger" onclick="stopCardToggle(event);deleteStudent('${s.id}')">Delete</button></div></div></div>`;
      }
      function detailHtml(s) { return `<div class="grid"><div><div class="k">Student ID</div><div class="v">${esc(s.student_number)}</div></div><div><div class="k">Full name</div><div class="v">${esc(s.full_name)}</div></div><div><div class="k">Sex</div><div class="v">${esc(s.sex)}</div></div><div><div class="k">Date of birth</div><div class="v">${esc(s.date_of_birth)}</div></div><div><div class="k">Contact</div><div class="v">${esc(s.contact_number)}</div></div><div><div class="k">Email</div><div class="v">${esc(s.email)}</div></div><div><div class="k">Provincial address</div><div class="v">${esc(s.provincial_address)}</div></div><div><div class="k">City address</div><div class="v">${esc(s.city_address)}</div></div><div><div class="k">Year graduated</div><div class="v">${esc(s.year_graduated)}</div></div><div><div class="k">Year residency</div><div class="v">${esc(s.year_residency)}</div></div></div>`; }
      function docRow(s,t,admin) { const d=docs.find(x=>x.student_id===s.id&&x.document_type_id===t.id), checked=!!d?.is_submitted; return `<div class="doc ${checked?"checked":""}"><span class="check" onclick="stopCardToggle(event);toggleDoc('${s.id}','${t.id}',${checked})">${checked?"✓":""}</span><span class="doclabel">${esc(t.name)}${t.is_required?" *":""}</span>${d?.file_url?`<a class="link" target="_blank" rel="noopener" href="${esc(d.file_url)}" onclick="stopCardToggle(event)">Open file</a>`:""}<input onclick="stopCardToggle(event)" id="url-${s.id}-${t.id}" placeholder="Document URL" value="${esc(d?.file_url||"")}"><button class="btn small" onclick="stopCardToggle(event);saveDoc('${s.id}','${t.id}')">Save</button>${d?.file_url?`<button class="btn small danger" onclick="stopCardToggle(event);removeDoc('${s.id}','${t.id}')">Remove</button>`:""}</div>`; }
      function toggleCard(id) { const card=document.getElementById("card-"+id); if(!card)return; document.querySelectorAll(".card.open").forEach(c=>{if(c!==card)c.classList.remove("open")}); card.classList.toggle("open"); }
      function stopCardToggle(e) { e.stopPropagation(); }
      async function toggleDoc(studentId,typeId,checked) { const {data,error}=await sb.from("student_documents").upsert({student_id:studentId,document_type_id:typeId,is_submitted:!checked,submitted_at:!checked?new Date().toISOString():null},{onConflict:"student_id,document_type_id"}).select().single(); if(error){alert(error.message);return;} const i=docs.findIndex(d=>d.student_id===studentId&&d.document_type_id===typeId); if(i>=0)docs[i]=data;else docs.push(data); renderStudents(studentId); }
      async function saveDoc(studentId,typeId) { const input=document.getElementById(`url-${studentId}-${typeId}`); const file_url=input.value.trim(); const {data,error}=await sb.from("student_documents").upsert({student_id:studentId,document_type_id:typeId,is_submitted:true,file_url,submitted_at:new Date().toISOString()},{onConflict:"student_id,document_type_id"}).select().single(); if(error){alert(error.message);return;} const i=docs.findIndex(d=>d.student_id===studentId&&d.document_type_id===typeId); if(i>=0)docs[i]=data;else docs.push(data); renderStudents(studentId); }
      async function removeDoc(studentId,typeId) { const {data,error}=await sb.from("student_documents").upsert({student_id:studentId,document_type_id:typeId,is_submitted:false,file_url:null,submitted_at:null},{onConflict:"student_id,document_type_id"}).select().single(); if(error){alert(error.message);return;} const i=docs.findIndex(d=>d.student_id===studentId&&d.document_type_id===typeId); if(i>=0)docs[i]=data;else docs.push(data); renderStudents(studentId); }
      function stamp(studentId) { const total=docTypes.length, complete=docs.filter(d=>d.student_id===studentId&&d.is_submitted).length; if(total===0||complete===total)return ["Complete","complete"]; if(complete===0)return ["No documents","empty"]; return [`${complete}/${total} submitted`,"partial"]; }
      function openStudentModal(id=null) { editingId=id; document.getElementById("modalTitle").textContent=id?"Edit student":"Add student"; clearError("modalError"); document.getElementById("studentModal").classList.add("open"); if(id){const s=students.find(x=>x.id===id); if(!s)return; document.getElementById("fNumber").value=s.student_number||"";document.getElementById("fName").value=s.full_name||"";document.getElementById("fSex").value=s.sex||"";document.getElementById("fDob").value=s.date_of_birth||"";document.getElementById("fContact").value=s.contact_number||"";document.getElementById("fEmail").value=s.email||"";document.getElementById("fProv").value=s.provincial_address||"";document.getElementById("fCity").value=s.city_address||"";document.getElementById("fGrad").value=s.year_graduated??"";document.getElementById("fResid").value=s.year_residency??"";document.getElementById("fPassword").value="";document.getElementById("fPasswordConfirm").value="";}else{["fNumber","fName","fDob","fContact","fEmail","fProv","fCity","fGrad","fResid","fPassword","fPasswordConfirm"].forEach(id=>document.getElementById(id).value="");document.getElementById("fSex").value="";} }
      function closeStudentModal(){document.getElementById("studentModal").classList.remove("open");}
      async function saveStudent(){ clearError("modalError"); const payload={student_number:document.getElementById("fNumber").value.trim(),full_name:document.getElementById("fName").value.trim(),sex:document.getElementById("fSex").value||null,date_of_birth:document.getElementById("fDob").value||null,contact_number:document.getElementById("fContact").value.trim()||null,email:document.getElementById("fEmail").value.trim()||null,provincial_address:document.getElementById("fProv").value.trim()||null,city_address:document.getElementById("fCity").value.trim()||null,year_graduated:document.getElementById("fGrad").value?Number(document.getElementById("fGrad").value):null,year_residency:document.getElementById("fResid").value?Number(document.getElementById("fResid").value):null}; const pw=document.getElementById("fPassword").value; const pc=document.getElementById("fPasswordConfirm").value; if(pw&&pw.length<8){setError("modalError","Password must be at least 8 characters.");return;} if(pw!==pc){setError("modalError","Passwords do not match.");return;} try { if(editingId){const {data,error}=await sb.from("students").update(payload).eq("id",editingId).select().single();if(error)throw error;const i=students.findIndex(s=>s.id===editingId);if(i>=0)students[i]=data;}else{const {data,error}=await sb.functions.invoke("create-student",{body:{...payload,password:pw||null}});if(error)throw error;if(!data?.student)throw new Error(data?.error||"Unable to create student.");students.push(data.student);} closeStudentModal(); await loadAdminData(); } catch(e){setError("modalError",e.message||"Unable to save student.");} }
      function editStudent(id){openStudentModal(id)}
      async function deleteStudent(id){if(!confirm("Delete this student and their documents?"))return; const {error}=await sb.from("students").delete().eq("id",id);if(error){alert(error.message);return;}students=students.filter(s=>s.id!==id);docs=docs.filter(d=>d.student_id!==id);renderStudents();}
      async function loadStudentProfile(studentId){const {data:s,error:se}=await sb.from("students").select("*").eq("id",studentId).single();const {data:d,error:de}=await sb.from("student_documents").select("*").eq("student_id",studentId);const {data:t,error:te}=await sb.from("document_types").select("*").order("name");if(se||de||te)throw se||de||te;const student=s; document.getElementById("studentProfile").innerHTML=`<div class="panel" style="padding:20px"><h2 style="font:500 22px Georgia,serif;margin-top:0">${esc(student.full_name)}</h2>${detailHtml(student)}<div class="docs"><h3>Document checklist</h3>${(t||[]).map(dt=>{const row=(d||[]).find(x=>x.document_type_id===dt.id);return `<div class="doc ${row?.is_submitted?"checked":""}"><span class="check">${row?.is_submitted?"✓":""}</span><span class="doclabel">${esc(dt.name)}${dt.is_required?" *":""}</span>${row?.file_url?`<a class="link" target="_blank" rel="noopener" href="${esc(row.file_url)}">Open file</a>`:"<span class="meta">Not submitted</span>"}</div>`}).join("")}</div></div>`;}
      function signOut(){sb.auth.signOut();session=null;document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden");document.getElementById("loginPassword").value="";}
      function openForgotPassword(){clearError("forgotError");forgotEmail="";document.getElementById("forgotEmail").value="";document.getElementById("forgotOtp").value="";document.getElementById("forgotNewPassword").value="";document.getElementById("forgotConfirmPassword").value="";document.getElementById("forgotStep1").classList.remove("hidden");document.getElementById("forgotStep2").classList.add("hidden");document.getElementById("forgotDescription").textContent="Enter your admin email. A one-time password will be sent to that email for verification.";document.getElementById("forgotModal").classList.add("open");}
      function closeForgotPassword(){document.getElementById("forgotModal").classList.remove("open");}
      async function sendAdminOtp(){clearError("forgotError");const email=document.getElementById("forgotEmail").value.trim();if(!email){setError("forgotError","Enter your admin email.");return;}try{const {error}=await sb.auth.resetPasswordForEmail(email);if(error)throw error;forgotEmail=email;document.getElementById("forgotStep1").classList.add("hidden");document.getElementById("forgotStep2").classList.remove("hidden");document.getElementById("forgotDescription").textContent="Enter the 8-digit OTP sent to your email, then choose a new password.";}catch(e){setError("forgotError",e.message||"Unable to send OTP.");}}
      async function verifyAdminOtpAndReset(){clearError("forgotError");const token=document.getElementById("forgotOtp").value.trim();const p=document.getElementById("forgotNewPassword").value;const c=document.getElementById("forgotConfirmPassword").value;if(!/^\d{8}$/.test(token)){setError("forgotError","Enter the 8-digit OTP.");return;}if(p.length<8){setError("forgotError","Password must be at least 8 characters.");return;}if(p!==c){setError("forgotError","Passwords do not match.");return;}try{const {data,error}=await sb.auth.verifyOtp({email:forgotEmail,token,type:"recovery"});if(error)throw error;if(data?.session){const {error:ue}=await sb.auth.updateUser({password:p});if(ue)throw ue;}else throw new Error("OTP verified, but no recovery session was created.");closeForgotPassword();alert("Password updated successfully. You can now sign in with your new password.");await sb.auth.signOut();}catch(e){setError("forgotError",e.message||"OTP verification failed.");}}
      sb.auth.onAuthStateChange(async (_event,s)=>{if(s&&!session){session=s;await enterApp();}});
    </script>
  </body>
</html>
